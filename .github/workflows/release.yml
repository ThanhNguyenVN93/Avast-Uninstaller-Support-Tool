name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Verify embedded avastclear signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature avast_av_clear.exe
          Write-Host "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "avast_av_clear.exe signature is not valid" }
          if ($sig.SignerCertificate.Subject -notmatch 'Avast|Gen Digital|NortonLifeLock') { throw "Unexpected signer" }

      - name: Check version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $src = (Select-String -Path Program.cs -Pattern 'AppVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($src -ne $tag) { throw "Program.cs AppVersion ($src) does not match tag ($tag)" }

      - name: Build Release
        shell: pwsh
        env:
          FX_REF: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8
        run: |
          msbuild frm_avast_uninstaller.csproj /p:Configuration=Release /p:FrameworkPathOverride="$env:FX_REF" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash "bin/Release/Avast Uninstaller Support Tool.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  Avast Uninstaller Support Tool.exe" } | Set-Content bin/Release/SHA256SUMS.txt
          Get-Content bin/Release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bin/Release/Avast Uninstaller Support Tool.exe
            bin/Release/SHA256SUMS.txt
